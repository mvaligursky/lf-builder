name: Scheduled Build

# Twice a week, check whether the upstream moving "nightly" tag points at a commit
# we have not built yet. If so, build that exact commit on Windows and publish a
# release here (named nightly-<date>-<shortsha>) with the portable zip attached.
# Keeps only the most recent few releases. Also runnable on demand.
#
# Upstream slug is in the UPSTREAM_REPO Actions variable so a code search for the
# upstream name will not match this file.

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Mon & Thu at 06:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref/SHA to build (blank = the 'nightly' tag)
        required: false
        type: string
      force:
        description: Build even if this commit was already built
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # create/delete releases + push keep-alive commit

concurrency:
  group: scheduled-build
  cancel-in-progress: false

env:
  KEEP_RELEASES: '3'   # how many most-recent releases to retain

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      sha: ${{ steps.resolve.outputs.sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Resolve upstream commit and decide
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ vars.UPSTREAM_REPO }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-nightly}"
          # Resolve any ref (tag/branch/sha) to its commit SHA.
          SHA="$(gh api "repos/$UPSTREAM/commits/$REF" --jq .sha)"
          SHORT="${SHA:0:7}"
          DATE="$(date -u +%Y%m%d)"
          REL="nightly-$DATE-$SHORT"
          echo "sha=$SHA"            >> "$GITHUB_OUTPUT"
          echo "release_tag=$REL"    >> "$GITHUB_OUTPUT"

          # Already built this commit? (any existing release tag ending in -<short>)
          EXISTING="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' || true)"
          if echo "$EXISTING" | grep -q -- "-$SHORT\$"; then
            if [ "${FORCE:-false}" = "true" ]; then
              echo "Commit $SHORT already built but force=true -> building."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Commit $SHORT already built -> skipping."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Commit $SHORT not built yet -> building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep-alive (prevents 60-day cron auto-disable)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-checked
          git add .last-checked
          git commit -m "chore: keep-alive [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BUILD_TYPE: release
    steps:
      - name: Checkout upstream source at commit
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Install CUDA 12.8
        run: |
          cd ..
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe -OutFile cuda.exe -Verbose
          Start-Process -FilePath .\cuda.exe -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        run: |
          echo "CUDA_PATH_V12_8=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-2026-03-12
          restore-keys: vcpkg-tool-${{ runner.os }}-

      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg_installed
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-

      - name: Configure
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PORTABLE=ON -DBUILD_PYTHON_STUBS=OFF

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build -j %NUMBER_OF_PROCESSORS%

      - name: Dump failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $paths = @(
            'build\vcpkg-manifest-install.log',
            'build\vcpkg_installed\vcpkg\issue_body.md',
            'build\CMakeFiles\CMakeConfigureLog.yaml',
            'build\CMakeFiles\CMakeError.log',
            'build\CMakeFiles\CMakeOutput.log',
            'build\CMakeCache.txt'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "::group::$path"
              Get-Content $path -Tail 400
              Write-Host "::endgroup::"
            }
          }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = "lichtfeld-windows-${{ needs.check.outputs.release_tag }}.zip"
          cmake --install build --prefix dist
          Compress-Archive -Path dist\* -DestinationPath $packageName
          "package_name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ needs.check.outputs.release_tag }}
          SHA: ${{ needs.check.outputs.sha }}
          UPSTREAM: ${{ vars.UPSTREAM_REPO }}
          ZIP: ${{ steps.package.outputs.package_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = "Unofficial portable Windows build.`nBuilt from $env:UPSTREAM commit ``$env:SHA`` (GPL-3.0; corresponding source at that commit)."
          gh release create $env:REL $env:ZIP `
            --repo $env:GITHUB_REPOSITORY `
            --title "Windows build $env:REL" `
            --notes $notes

      - name: Prune old releases (keep most recent KEEP_RELEASES)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $keep = [int]"${{ env.KEEP_RELEASES }}"
          $all = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,createdAt | ConvertFrom-Json
          $stale = $all | Sort-Object { [datetime]$_.createdAt } -Descending | Select-Object -Skip $keep
          foreach ($r in $stale) {
            Write-Host "Deleting old release $($r.tagName)"
            gh release delete $r.tagName --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          }
