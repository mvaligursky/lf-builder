name: Scheduled Build

# Runs daily. Decision order:
#   1. If upstream's latest semver tag (vX.Y.Z) has not been built here -> build it,
#      publish as <tag>-win.
#   2. Else if no build happened in the last 7 days -> build the tip of upstream's
#      master branch, publish as dev-<date>-<shortsha>.
#   3. Otherwise do nothing.
# A committed state.json tracks what has been built and when, so decisions are
# independent of release pruning. Also runnable on demand.
#
# Upstream slug is in the UPSTREAM_REPO Actions variable so a code search for the
# upstream name will not match this file.

on:
  schedule:
    - cron: '17 6 * * *'   # daily at 06:17 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref/SHA to build on demand (blank = use the daily logic)
        required: false
        type: string
      force:
        description: Force a build of the current master tip even if nothing is due
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # create/delete releases + push state/keep-alive commits

concurrency:
  group: scheduled-build
  cancel-in-progress: false

env:
  KEEP_DEV_BUILDS: '3'   # dev-* builds to retain; tagged (v*-win) releases are kept forever

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      sha: ${{ steps.resolve.outputs.sha }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Decide what (if anything) to build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ vars.UPSTREAM_REPO }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ -f state.json ]; then STATE="$(cat state.json)"; else STATE='{"built":[],"last_build":null}'; fi
          is_built()     { echo "$STATE" | jq -e --arg t "$1"  '.built | index($t) != null'   >/dev/null 2>&1; }
          is_built_sha() { echo "$STATE" | jq -e --arg s "-$1" 'any(.built[]; endswith($s))'   >/dev/null 2>&1; }

          MODE=""; SHA=""; REL=""; BUILD=false

          if [ -n "${INPUT_REF:-}" ]; then
            MODE=manual
            SHA="$(gh api "repos/$UPSTREAM/commits/$INPUT_REF" --jq .sha)"
            SAFE="$(echo "$INPUT_REF" | tr '/' '-')"
            REL="manual-$SAFE-${SHA:0:7}"
            BUILD=true
          else
            # 1) Newest semver tag upstream (vX, vX.Y, vX.Y.Z), excluding 'nightly'.
            LATEST_TAG="$(gh api "repos/$UPSTREAM/tags" --paginate --jq '.[].name' \
                          | grep -E '^v[0-9]+(\.[0-9]+){0,2}$' | sort -V | tail -1 || true)"
            if [ -n "$LATEST_TAG" ] && ! is_built "${LATEST_TAG}-win"; then
              MODE=tag
              SHA="$(gh api "repos/$UPSTREAM/commits/$LATEST_TAG" --jq .sha)"
              REL="${LATEST_TAG}-win"
              BUILD=true
            else
              # 2) No new tag -> build master tip if it's been >7 days since last build.
              LAST="$(echo "$STATE" | jq -r '.last_build // empty')"
              STALE=true
              if [ -n "$LAST" ]; then
                LE="$(date -u -d "$LAST" +%s 2>/dev/null || echo 0)"
                if [ "$LE" -gt 0 ] && [ "$(( $(date -u +%s) - LE ))" -lt "$((7*86400))" ]; then STALE=false; fi
              fi
              if [ "$STALE" = true ]; then
                SHA="$(gh api "repos/$UPSTREAM/commits/master" --jq .sha)"
                if ! is_built_sha "${SHA:0:7}"; then
                  MODE=periodic
                  REL="dev-$(date -u +%Y%m%d)-${SHA:0:7}"
                  BUILD=true
                fi
              fi
            fi
          fi

          # Manual force: build the current master tip even if nothing was due.
          if [ "${FORCE:-false}" = "true" ] && [ "$BUILD" != "true" ]; then
            MODE=forced
            SHA="$(gh api "repos/$UPSTREAM/commits/master" --jq .sha)"
            REL="dev-$(date -u +%Y%m%d)-${SHA:0:7}"
            BUILD=true
          fi

          echo "Decision: should_build=$BUILD mode=${MODE:-none} tag=${REL:-none} sha=${SHA:0:7}"
          {
            echo "should_build=$BUILD"
            echo "sha=$SHA"
            echo "release_tag=$REL"
            echo "mode=$MODE"
          } >> "$GITHUB_OUTPUT"

      - name: Keep-alive (prevents 60-day cron auto-disable)
        if: steps.resolve.outputs.should_build != 'true'   # build days are recorded by the record job
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Push can race with other runs; always rebase onto latest main and retry.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-checked
            git add .last-checked
            git commit -q -m "chore: keep-alive [skip ci]" || { echo "nothing to commit"; exit 0; }
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            echo "push rejected, retrying ($attempt)"; sleep $((attempt * 3))
          done
          echo "keep-alive push failed after retries"; exit 1

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BUILD_TYPE: release
    steps:
      - name: Checkout upstream source at commit
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Install CUDA 12.8
        run: |
          cd ..
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe -OutFile cuda.exe -Verbose
          Start-Process -FilePath .\cuda.exe -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        run: |
          echo "CUDA_PATH_V12_8=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-2026-03-12
          restore-keys: vcpkg-tool-${{ runner.os }}-

      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg_installed
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmakeArgs = '-B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PORTABLE=ON -DBUILD_PYTHON_STUBS=OFF'
          # vcpkg downloads dependency sources from the internet during configure;
          # transient 5xx/timeout failures are common. Retry up to 3 times, only
          # when the manifest log shows a retryable network error.
          $retryablePatterns = @(
            'status code 5\d\d', 'timed out', 'timeout',
            'connection reset', 'failed to connect',
            'temporarily unavailable', 'tls', 'ssl'
          )
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Configure attempt $attempt/3"
            cmd /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cmake $cmakeArgs"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $shouldRetry = $false
            if (Test-Path 'build\vcpkg-manifest-install.log') {
              foreach ($pattern in $retryablePatterns) {
                if (Select-String -Path 'build\vcpkg-manifest-install.log' -Pattern $pattern -Quiet) {
                  $shouldRetry = $true; break
                }
              }
            }
            if (-not $shouldRetry -or $attempt -eq 3) { exit $LASTEXITCODE }
            Write-Warning "Retryable configure failure detected, cleaning build tree before retry."
            if (Test-Path 'build') { Remove-Item -Recurse -Force 'build' }
            Start-Sleep -Seconds (15 * $attempt)
          }

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build -j %NUMBER_OF_PROCESSORS%

      - name: Dump failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $paths = @(
            'build\vcpkg-manifest-install.log',
            'build\vcpkg_installed\vcpkg\issue_body.md',
            'build\CMakeFiles\CMakeConfigureLog.yaml',
            'build\CMakeFiles\CMakeError.log',
            'build\CMakeFiles\CMakeOutput.log',
            'build\CMakeCache.txt'
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "::group::$path"
              Get-Content $path -Tail 400
              Write-Host "::endgroup::"
            }
          }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageName = "lichtfeld-windows-${{ needs.check.outputs.release_tag }}.zip"
          cmake --install build --prefix dist
          Compress-Archive -Path dist\* -DestinationPath $packageName
          "package_name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REL: ${{ needs.check.outputs.release_tag }}
          SHA: ${{ needs.check.outputs.sha }}
          MODE: ${{ needs.check.outputs.mode }}
          UPSTREAM: ${{ vars.UPSTREAM_REPO }}
          ZIP: ${{ steps.package.outputs.package_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = "Unofficial portable Windows build ($env:MODE).`nBuilt from $env:UPSTREAM commit ``$env:SHA`` (GPL-3.0; corresponding source at that commit)."
          gh release create $env:REL $env:ZIP `
            --repo $env:GITHUB_REPOSITORY `
            --title "Windows build $env:REL" `
            --notes $notes

  record:
    needs: [check, build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record build in state.json
        env:
          REL: ${{ needs.check.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-apply onto the latest main each attempt so a concurrent push can't
          # leave us on a stale base (the bug that previously dropped state.json).
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            [ -f state.json ] || echo '{"built":[],"last_build":null}' > state.json
            TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            tmp="$(mktemp)"
            jq --arg rel "$REL" --arg ts "$TS" \
              '.built = ((.built + [$rel]) | unique) | .last_build = $ts' state.json > "$tmp"
            mv "$tmp" state.json
            git add state.json
            git commit -q -m "chore: record build $REL [skip ci]" || { echo "no change to record"; exit 0; }
            if git push -q origin HEAD:main; then echo "recorded $REL"; exit 0; fi
            echo "push rejected, retrying ($attempt)"; sleep $((attempt * 3))
          done
          echo "failed to record state after retries"; exit 1

      - name: Prune old dev releases (tagged releases are kept forever)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEEP="${KEEP_DEV_BUILDS}"
          # Only consider dev-* releases; v*-win and manual-* are never pruned.
          mapfile -t TAGS < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .[] | select(.tagName | startswith("dev-")) | .tagName')
          i=0
          for t in "${TAGS[@]}"; do
            i=$((i+1))
            if [ "$i" -gt "$KEEP" ]; then
              echo "Deleting old dev release $t"
              gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
